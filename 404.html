<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada | Alberto Ortiz Sánchez</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1b263b 0%, #0b5ed7 100%);
            color: #fff;
        }

        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(5rem, 18vw, 10rem);
            line-height: 1;
            margin: 0;
            color: rgba(255, 255, 255, 0.18);
            letter-spacing: 0.05em;
        }

        .error-page h1 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            margin: 10px 0 12px;
            color: #fff;
        }

        .error-page p {
            max-width: 480px;
            margin: 0 auto 30px;
            color: rgba(255, 255, 255, 0.85);
        }

        .error-page .btn {
            background: #fff;
            color: #0b5ed7;
            border-color: #fff;
        }

        .error-page .btn:hover {
            background: transparent;
            color: #fff;
        }
    </style>
</head>

<body>
    <main class="error-page">
        <div>
            <p class="error-code">404</p>
            <h1>Esta página no existe</h1>
            <p>Puede que el enlace esté mal escrito o que la página se haya movido. Vuelve al portfolio para seguir
                explorando.</p>
            <a class="btn" href="/">Volver al portfolio</a>
            <p style="margin-top:26px;font-size:.85rem;opacity:.75">This page could not be found — <a
                    href="/" style="color:#fff;text-decoration:underline">back to the portfolio</a>.</p>
        </div>
    </main>
</body>

</html>
