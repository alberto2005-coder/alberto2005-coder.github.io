name: Notificar Indexación a Motores de Búsqueda

on:
  push:
    branches:
      - main  # Cambia esto a 'master' o 'gh-pages' si tu rama de producción de GitHub Pages se llama diferente

jobs:
  indexnow-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Enviar lote de URLs mediante POST JSON al endpoint central de IndexNow
        run: |
          curl -X POST "https://api.indexnow.org/IndexNow" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d '{
            "host": "albertoortiz.is-a.dev",
            "key": "3f9c2a7e5b1d48c6a0e7d2b94f6c81a5",
            "keyLocation": "https://albertoortiz.is-a.dev/3f9c2a7e5b1d48c6a0e7d2b94f6c81a5.txt",
            "urlList": [
              "https://albertoortiz.is-a.dev/"
            ]
          }'